<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Thực hành FPGA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Thực hành FPGA Tang Nano 9K</h2>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="student_id">Mã số sinh viên:</label>
                <input type="text" id="student_id" name="student_id" required placeholder="Nhập MSSV">
            </div>
            <div class="form-group">
                <label for="full_name">Họ và tên:</label>
                <input type="text" id="full_name" name="full_name" required placeholder="Nhập họ và tên">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Bắt đầu bài làm</button>
        </form>
    </div>
</body>
</html>
